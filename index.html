<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Frag ÖkoKarl 🌿</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 2rem auto;
      padding: 1rem;
      background-color: #f8faf5;
    }
    textarea {
      width: 100%;
      padding: 0.5rem;
      font-size: 1rem;
    }
    button {
      background: #228b22;
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 0.5rem;
    }
    button:hover {
      background: #1a6f1a;
    }
    .antwortbox {
      background: #fff;
      padding: 1rem;
      margin-top: 1rem;
      border-left: 4px solid #228b22;
    }
  </style>
</head>
<body>
  <h1>Frag ÖkoKarl 🌿</h1>
  <p>Stell deine Frage zum Nachhaltigkeitsprojekt:</p>
  <textarea id="frage" rows="4" placeholder="z.B. Was ist eine SWOT-Analyse?"></textarea><br />
  <button onclick="sendeFrage()">Absenden</button>
  <div id="antwort" class="antwortbox" style="display:none"></div>

  <script>
    async function sendeFrage() {
      const frage = document.getElementById('frage').value;
      const antwortBox = document.getElementById('antwort');
      if (!frage.trim()) return;
      antwortBox.innerText = 'ÖkoKarl denkt nach...';
      antwortBox.style.display = 'block';

      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ frage })
        });
        const data = await res.json();
        antwortBox.innerText = data.antwort || 'Keine Antwort erhalten.';
      } catch (e) {
        antwortBox.innerText = 'Fehler beim Senden der Anfrage.';
      }
    }
  </script>
</body>
</html>
